[project]
name = "pjet"
version = "0.5.0"
description = "Python dependencies for PJET's vendored flight-emissions bridge"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=3.0.3",
  "pint>=0.25.3",
  "pint-pandas>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
