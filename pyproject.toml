[project]
name = "pjet"
version = "0.1.0"
description = "Private Jet Emissions Tracker data builder"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=3.0.3",
  "pint>=0.25.3",
  "pint-pandas>=0.8.0",
]

[project.scripts]
pjet = "pjet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"
