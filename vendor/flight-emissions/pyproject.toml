[project]
name = "ghgc"
version = "0.1.0"
description = "Re-implementations of methods used to calculate the greenhouse gas (GHG) emissions of a flight"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "pandas",
    "pint",
    "pint-pandas",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ghgc*"]
